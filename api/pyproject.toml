[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "serenity"
version = "0.0.0"
description = "Self-hosted password manager with a dual-zone encrypted vault and an agent."
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.11.3,<4",
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.15,<3",
    "pynacl>=1.6.2,<2",
    "pyotp>=2.10,<3",
    "sqlmodel>=0.0.42,<0.1",
    "uvicorn>=0.53,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["serenity*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use fake, throwaway credentials.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"

# APScheduler 3.x ships no type information.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
