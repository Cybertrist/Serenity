# ntfy server configuration for Serenity.
# base-url is injected by docker-compose (NTFY_BASE_URL).
listen-http: ":8080"
behind-proxy: true

cache-file: /var/lib/ntfy/cache.db
cache-duration: "24h"

# Authentication: nobody can read or publish unless explicitly allowed.
auth-file: /var/lib/ntfy/auth.db
auth-default-access: deny-all

# No self sign-up; users are created with `ntfy user add`.
enable-signup: false
enable-login: true
enable-reservations: false

# No attachments: Serenity only sends short text notifications.
attachment-cache-dir: ""

log-level: info
