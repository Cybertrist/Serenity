name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      # Skipped until the backend project exists (phase 3).
      - id: detect
        run: |
          if grep -q '^\[project\]' pyproject.toml 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::api/pyproject.toml not initialised yet, backend checks skipped."
          fi
      - if: steps.detect.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - if: steps.detect.outputs.enabled == 'true'
        run: pip install -e ".[dev]"
      - if: steps.detect.outputs.enabled == 'true'
        run: ruff check .
      - if: steps.detect.outputs.enabled == 'true'
        run: ruff format --check .
      - if: steps.detect.outputs.enabled == 'true'
        run: mypy serenity
      - if: steps.detect.outputs.enabled == 'true'
        run: pytest

  frontend:
    name: Frontend (eslint, prettier, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Skipped while web/package.json is empty.
      - id: detect
        run: |
          if [ -s package.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web/package.json not initialised yet, frontend checks skipped."
          fi
      - if: steps.detect.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.detect.outputs.enabled == 'true'
        run: npm ci
      - if: steps.detect.outputs.enabled == 'true'
        run: npm run lint
      - if: steps.detect.outputs.enabled == 'true'
        run: npm run format:check
      - if: steps.detect.outputs.enabled == 'true'
        run: npm test -- --run
      - if: steps.detect.outputs.enabled == 'true'
        run: npm run build

  crypto-interop:
    name: Crypto interop (Python <-> TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e "./api[dev]"
      - run: npm ci
        working-directory: web
      # Static vectors are already checked by the backend and frontend jobs.
      # Here each side decrypts fresh, randomized blocks produced by the other.
      - name: Python produces
        run: python api/tests/crypto/interop.py produce "$RUNNER_TEMP/py.json"
      - name: TypeScript verifies, then produces
        working-directory: web
        run: |
          INTEROP_VERIFY="$RUNNER_TEMP/py.json" npx vitest --run src/crypto/interop.test.ts
          INTEROP_PRODUCE="$RUNNER_TEMP/ts.json" npx vitest --run src/crypto/interop.test.ts
          test -s "$RUNNER_TEMP/ts.json"
      - name: Python verifies
        run: python api/tests/crypto/interop.py verify "$RUNNER_TEMP/ts.json"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
