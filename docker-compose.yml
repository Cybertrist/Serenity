# Serenity stack. See docs/02-infrastructure.md.
# Every published port is bound to 127.0.0.1; external access goes through `tailscale serve`.

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  ntfy:
    <<: *hardening
    image: binwiederhier/ntfy:v2.28.0
    command: serve
    user: "10002:10002"
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      NTFY_BASE_URL: https://${TAILNET_HOST:?set TAILNET_HOST in .env}:8443
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./ops/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ./data/ntfy:/var/lib/ntfy
    ports:
      - "127.0.0.1:8090:8080"
    networks: [edge, internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/v1/health | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  api:
    <<: *hardening
    build:
      context: ./api
      target: runtime
    image: serenity-api:local
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    # Variables are passed explicitly (never the whole .env) so the api only sees what it needs.
    environment:
      TZ: ${TZ:-Europe/Paris}
      SERENITY_PUBLIC_URL: https://${TAILNET_HOST:?set TAILNET_HOST in .env}
      SERENITY_SECRET_KEY: ${SERENITY_SECRET_KEY:?set SERENITY_SECRET_KEY in .env}
      SERENITY_DB_PATH: ${SERENITY_DB_PATH:-/data/serenity.sqlite}
      SERENITY_AUTH_FILE: ${SERENITY_AUTH_FILE:-/data/auth.json}
      SERENITY_SESSION_TTL_HOURS: ${SERENITY_SESSION_TTL_HOURS:-12}
      SERENITY_LOGIN_MAX_ATTEMPTS: ${SERENITY_LOGIN_MAX_ATTEMPTS:-5}
      SERENITY_LOGIN_LOCKOUT_MINUTES: ${SERENITY_LOGIN_LOCKOUT_MINUTES:-15}
      SERENITY_LOG_LEVEL: ${SERENITY_LOG_LEVEL:-INFO}
      SERENITY_NTFY_URL: http://ntfy:8080
    volumes:
      - ./data/api:/data
    # No published port: only reachable by `web` on the internal network.
    networks: [internal, egress]
    depends_on:
      ntfy:
        condition: service_healthy

  web:
    <<: *hardening
    build:
      context: ./web
    image: serenity-web:local
    # nginx master needs to switch to its worker user.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    ports:
      - "127.0.0.1:8080:8080"
    networks: [edge, internal]
    depends_on:
      api:
        condition: service_healthy

networks:
  # Service-to-service traffic. No Internet access.
  internal:
    internal: true
  # Network for services published on 127.0.0.1.
  edge: {}
  # Outbound Internet for the api (Pwned Passwords, phase 5).
  egress: {}
