# Serenity stack. See docs/02-infrastructure.md.
# Every published port is bound to 127.0.0.1; external access goes through `tailscale serve`.

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *hardening
    build:
      context: ./api
      target: runtime
    image: serenity-api:local
    # Starts as root with SETUID/SETGID only, reads the TOTP key, then drops to UID 10001.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp]
    # Variables are passed explicitly (never the whole .env) so the api only sees what it needs.
    environment: &api-env
      TZ: ${TZ:-Europe/Paris}
      SERENITY_PUBLIC_URL: https://${TAILNET_HOST:?set TAILNET_HOST in .env}
      SERENITY_SECRET_KEY: ${SERENITY_SECRET_KEY:?set SERENITY_SECRET_KEY in .env}
      SERENITY_DB_PATH: /data/serenity.sqlite
      SERENITY_DEVICE_SESSION_DAYS: ${SERENITY_DEVICE_SESSION_DAYS:-60}
      SERENITY_UNLOCK_MINUTES: ${SERENITY_UNLOCK_MINUTES:-15}
      SERENITY_LOGIN_MAX_ATTEMPTS: ${SERENITY_LOGIN_MAX_ATTEMPTS:-5}
      SERENITY_LOGIN_LOCKOUT_BASE_MINUTES: ${SERENITY_LOGIN_LOCKOUT_BASE_MINUTES:-1}
      SERENITY_LOG_LEVEL: ${SERENITY_LOG_LEVEL:-INFO}
      SERENITY_HIBP_ENABLED: ${HIBP_API_KEY:+true}
      SERENITY_MAX_ROTATIONS_PER_DAY: ${SERENITY_MAX_ROTATIONS_PER_DAY:-3}
    volumes:
      - ./data/api:/data
      - ./api/allowlist.yaml:/app/allowlist.yaml:ro
      # TOTP key only: the api never sees the server key.
      - type: bind
        source: ./data/keys/totp.key
        target: /run/serenity/totp.key
        read_only: true
        bind: { create_host_path: false }
    # No published port: only reachable by `web` on the internal network.
    networks: [internal]

  agent:
    <<: *hardening
    image: serenity-api:local
    command: ["python", "-m", "serenity.run", "agent"]
    # Starts as root with SETUID/SETGID only, reads the server key, then drops to UID 10001.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *api-env
      SERENITY_WATCH_INTERVAL_HOURS: ${SERENITY_WATCH_INTERVAL_HOURS:-6}
      SERENITY_SCHEDULE_INTERVAL_MINUTES: ${SERENITY_SCHEDULE_INTERVAL_MINUTES:-60}
      # Paid HIBP key (optional): the agent alone calls HIBP.
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      # The executor (ADR-015). Without a token, approved rotations simply wait.
      SERENITY_ROTATOR_URL: ${SERENITY_ROTATOR_URL-http://rotator:8000}
      SERENITY_ROTATOR_TOKEN: ${SERENITY_ROTATOR_TOKEN:-}
    volumes:
      - ./data/api:/data
      # Sites the agent may rotate: edited on the host, read by code only.
      - ./api/allowlist.yaml:/app/allowlist.yaml:ro
      # Server key only: the agent alone can open the agent zone.
      - type: bind
        source: ./data/keys/server.key
        target: /run/serenity/server.key
        read_only: true
        bind: { create_host_path: false }
    # No port at all. Outbound Internet for Pwned Passwords (phase 5), plus the private
    # network it shares with the executor.
    networks: [egress, rotation]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/agent-heartbeat') > 90)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      # The api owns database migrations.
      api:
        condition: service_healthy

  # The only service with a browser, and the only one that opens a site (ADR-015).
  # It holds no key, no database, and nothing on disk.
  rotator:
    <<: *hardening
    build:
      context: ./rotator
    image: serenity-rotator:local
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp, /dev/shm]
    environment:
      TZ: ${TZ:-Europe/Paris}
      SERENITY_ROTATOR_TOKEN: ${SERENITY_ROTATOR_TOKEN:-}
      SERENITY_ROTATOR_STEP_TIMEOUT_MS: ${SERENITY_ROTATOR_STEP_TIMEOUT_MS:-15000}
    volumes:
      # Recipes are edited on the host and read by code only.
      - ./rotator/recipes:/app/recipes:ro
    # No published port: only the agent can reach it. Egress to reach the sites themselves.
    networks: [rotation, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/sante', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # The site the agent practises on: `docker compose --profile demo up -d`.
  demo:
    <<: *hardening
    profiles: [demo]
    build:
      context: ./demo
    image: serenity-demo:local
    cap_drop: [ALL]
    read_only: true
    environment:
      DEMO_USERNAME: ${DEMO_USERNAME:-tristan@exemple.fr}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-mot-de-passe-de-depart}
      DEMO_TOTP_SECRET: ${DEMO_TOTP_SECRET:-}
    ports:
      - "127.0.0.1:8090:8000"
    networks:
      edge: {}
      rotation:
        aliases: [demo.serenity.test]

  web:
    <<: *hardening
    build:
      context: ./web
    image: serenity-web:local
    # nginx master needs to switch to its worker user.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    ports:
      - "127.0.0.1:8080:8080"
    networks: [edge, internal]
    depends_on:
      api:
        condition: service_healthy

networks:
  # Service-to-service traffic. No Internet access.
  internal:
    internal: true
  # Network for services published on 127.0.0.1.
  edge: {}
  # Outbound Internet for the agent (Pwned Passwords, phase 5) and the executor (the sites).
  egress: {}
  # Agent <-> executor, and the demo site when its profile is up. No Internet.
  rotation:
    internal: true
